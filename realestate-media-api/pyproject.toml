[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realestate-media-api"
version = "0.1.0"
description = "Async API turning a property photo into a 3-aspect-ratio media kit (upscale → expand/outpaint → cinematic image-to-video) via fal.ai, orchestrated with LangGraph, fronted by Wix Velo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Real-Estate Media Kit" }]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "arq",
    "redis",
    "httpx",
    "fal-client",
    "langgraph",
    "langchain",
    "langchain-core",
    "langsmith",
    "sqlalchemy>=2",
    "aiosqlite",
    "python-json-logger",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "anyio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
